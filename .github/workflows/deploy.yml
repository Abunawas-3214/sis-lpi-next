name: Deploy SIS-LPI to VPS

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    name: Build & Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            # Muat environment bun
            export PATH="$HOME/.bun/bin:$PATH"

            echo "🚀 Menuju direktori aplikasi..."
            cd /var/www/sis-lpi

            echo "📥 Mengambil kode terbaru dari Git..."
            git pull origin main || git pull origin master

            echo "📦 Menginstal dependensi dengan Bun..."
            bun install --frozen-lockfile

            echo "🏗️ Membangun aplikasi Next.js produksi..."
            bun run build

            echo "🔄 Me-restart service sis-lpi..."
            sudo systemctl restart sis-lpi

            echo "✅ Deployment selesai dan berhasil!"
